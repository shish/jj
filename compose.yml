services:
  # Gerrit - admin:secret:secret
  gerrit:
    build:
      context: ./forges/gerrit
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:29418:29418"

  # Forgejo - admin2:secret:/data/api-key
  forgejo:
    build:
      context: ./forges/forgejo
    ports:
      - "127.0.0.1:8082:3000"
    post_start:
      - command: sh /scripts/init.sh

  # Phabricator - admin:secret:api-aaa...
  phabricator-mysql:
    build:
      context: ./forges/phabricator-mysql

  phabricator:
    build:
      context: ./forges/phabricator
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      phabricator-mysql:
        condition: service_healthy
    post_start:
      - command: sh /scripts/init.sh

  # GitLab - root:secret???:secret
  gitlab:
    build:
      context: ./forges/gitlab
    ports:
      - "127.0.0.1:8083:8083"
