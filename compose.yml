services:
  # Gerrit Code Review
  gerrit:
    image: gerritcodereview/gerrit:latest
    ports:
      - "8080:8080"
      - "29418:29418"
    environment:
      CANONICAL_WEB_URL: "http://gerrit.localhost:8080/"
    healthcheck:
      test: "curl --silent -f http://admin:secret@localhost:8080/a/accounts/me"
      start_period: 120s
      start_interval: 10s
      interval: 120s
      timeout: 5s

  # Forgejo
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    ports:
      - "8082:3000"
    environment:
      FORGEJO__server__ROOT_URL: "http://forgejo.localhost:8082/"
      FORGEJO__security__INSTALL_LOCK: "true"
    working_dir: /data
    healthcheck:
      # Wait until the server is up *and* the post_start-generated API token
      # exists and authenticates against the API.
      test:
        - CMD-SHELL
        - >-
          curl --silent -f -o /dev/null http://localhost:3000/api/healthz &&
          test -s /data/api-key &&
          curl --silent -f -o /dev/null
          -H "Authorization: token $$(awk '{print $$NF}' /data/api-key)"
          http://localhost:3000/api/v1/user
      start_period: 120s
      start_interval: 10s
      interval: 120s
      timeout: 5s
    post_start:
      - command:
          - sh
          - -ec
          - |
            sleep 5
            su git -s /bin/sh -c 'forgejo admin user create \
              --username admin2 \
              --password secret \
              --email admin2@forgejo.localhost \
              --admin \
              --must-change-password=false'
            su git -s /bin/sh -c 'forgejo admin user generate-access-token \
              --username admin2 \
              --token-name jj-api \
              --scopes all \
              ' > api-key
            chmod 600 api-key

  # Phabricator
  phabricator-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "phabricator"
      MYSQL_DATABASE: "phabricator"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pphabricator",
        ]
      interval: 10s
      timeout: 5s

  phabricator:
    image: phabricator/phabricator:latest
    ports:
      - "8081:80"
    depends_on:
      phabricator-mysql:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    healthcheck:
      test: "curl --silent -f http://phab.localhost:80/api/user.whoami -d api.token=cli-aaaaaaaaaaaaaaaaaaaaaaaaaaaa | grep -q verified"
      start_period: 120s
      start_interval: 10s
      interval: 120s
      timeout: 5s
    post_start:
      - command:
          - sh
          - -c
          - |
            set -e
            # basic settings
            bin/config set mysql.host phabricator-mysql
            bin/config set mysql.user root
            bin/config set mysql.pass phabricator
            bin/config set phabricator.base-uri http://phab.localhost:8081/
            bin/config set differential.allow-self-accept true
            # enable http server for diffusion (git) repositories
            bin/config set diffusion.allow-http-auth true
            bin/config set environment.append-paths '["/usr/lib/git-core"]'
            # install db
            bin/storage upgrade --force
            # create admin user with fixed API token and VCS HTTP password
            php /scripts/phab-init.php
            # start backend daemons
            runuser -u www-data bin/phd start

volumes:
  forgejo-data:
